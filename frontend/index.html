<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- ===========================
      METADADOS BÁSICOS
      =========================== -->
  <meta charset="UTF-8" />
  <title data-i18n="ui.titles.main">Irricontrol Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- Config frontend -> backend (local vs prod) -->
  <script src="assets/js/config.js?v=2"></script>

  <!-- ===========================
      PERFORMANCE: PRECONNECT
      =========================== -->
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
  
  <!-- ===========================
      BIBLIOTECAS DE TERCEIROS
      =========================== -->
  <!-- Tailwind CSS (build local) -->
  <link rel="stylesheet" href="dist/output.css?v=4">
  <!-- Ícones Lucide (SVG) -->
  <script src="https://unpkg.com/lucide@1.28.0/dist/umd/lucide.min.js"
          integrity="sha384-VrnzGPiSyQxm3mI2VhlssyR85zugSHtxMkgO42qV3wUAbNk1oRdZkCWjXKOhuVu6"
          crossorigin="anonymous" defer></script>
  <!-- Leaflet CSS (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous" defer></script>
  <!-- Mapbox (3D) -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.27.0/mapbox-gl.css" rel="stylesheet"
        integrity="sha384-XUbQaovfoSbaMso2Q1a1bLMGwU+1h7twi9V0vkuM6eOCZd0i52f6iAuxtHaP1nDO"
        crossorigin="anonymous" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.27.0/mapbox-gl.js"
          integrity="sha384-7ERH+4wJLuDpmJphMVoMUoS1/V7e+D5tR6ZywiuMjqkvGnCFBRPNuN4iywy90jEz"
          crossorigin="anonymous" defer></script>

  <!-- ===========================
      CSS DA APLICAÇÃO
      =========================== -->
  <link rel="stylesheet" href="assets/css/style.css?v=5" />
  <link rel="stylesheet" href="assets/css/login.css?v=2" />
  <!-- Layout mobile/tablet (modo visualização) - só atua em telas <=768px -->
  <link rel="stylesheet" href="assets/css/mobile.css?v=48" />
</head>

<body class="bg-[#060B10] text-white h-screen w-screen overflow-hidden">

  <!-- LOGIN OVERLAY (fica por cima do app) -->
  <div id="login-overlay" class="login-overlay hidden" aria-hidden="true">
    <!-- background layers (isolado do app) -->
    <div class="login-bg" aria-hidden="true">
      <div class="bg__grid"></div>
      <div class="bg__scan"></div>
      <div class="bg__glow"></div>
      <canvas id="particles" class="bg__particles" aria-hidden="true"></canvas>
    </div>

    <main class="shell">
      <section class="card" role="region" aria-label="Login Irricontrol" data-i18n="ui.titles.login_region" data-i18n-attr="aria-label">
        <header class="brand">
          <div class="brand__mark">
            <img
              src="assets/images/logo-irricontrol.png"
              alt="Irricontrol"
              loading="lazy"
              decoding="async"
            />
          </div>
        </header>

        <div class="login-langs" aria-label="Idioma" data-i18n="ui.labels.language" data-i18n-attr="aria-label">
          <button
            data-lang="pt-br"
            class="lang-btn"
            type="button"
            data-i18n="ui.languages.pt_br"
            data-i18n-attr="title,aria-label"
          >
            <img src="assets/images/br.svg" alt="" aria-hidden="true" />
          </button>
          <button
            data-lang="es"
            class="lang-btn"
            type="button"
            data-i18n="ui.languages.es"
            data-i18n-attr="title,aria-label"
          >
            <img src="assets/images/es.svg" alt="" aria-hidden="true" />
          </button>
          <button
            data-lang="de"
            class="lang-btn"
            type="button"
            data-i18n="ui.languages.de"
            data-i18n-attr="title,aria-label"
          >
            <img src="assets/images/de.svg" alt="" aria-hidden="true" />
          </button>
          <button
            data-lang="en"
            class="lang-btn"
            type="button"
            data-i18n="ui.languages.en"
            data-i18n-attr="title,aria-label"
          >
            <img src="assets/images/uk.svg" alt="" aria-hidden="true" />
          </button>
          <button
            data-lang="ru"
            class="lang-btn"
            type="button"
            data-i18n="ui.languages.ru"
            data-i18n-attr="title,aria-label"
          >
            <img src="assets/images/ru.svg" alt="" aria-hidden="true" />
          </button>
        </div>

        <div class="divider"></div>

        <form id="login-form" class="form" autocomplete="on" novalidate>
          <label class="field">
            <span class="field__label" data-i18n="ui.labels.username">Usuário</span>
            <span class="field__wrap">
              <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                placeholder=""
                autocomplete="username"
                required
              />
              <span class="field__icon" aria-hidden="true">
                <img src="assets/images/user.svg" alt="" class="icon-user" />
              </span>
            </span>
            <span class="field__hint"></span>
          </label>

          <label class="field">
            <span class="field__label" data-i18n="ui.labels.password">Senha</span>
            <span class="field__wrap">
              <input
                id="password"
                name="password"
                type="password"
                placeholder=""
                autocomplete="current-password"
                minlength="4"
                required
              />
              <button
                id="togglePass"
                class="iconBtn"
                type="button"
                aria-label="Mostrar/ocultar senha"
                data-i18n="ui.titles.toggle_password"
                data-i18n-attr="aria-label,title"
              >
                <img
                  class="icon-eye"
                  src="assets/images/eye.svg"
                  alt=""
                  aria-hidden="true"
                />
                <img
                  class="icon-eye-off"
                  src="assets/images/eye-off.svg"
                  alt=""
                  aria-hidden="true"
                  style="display:none;"
                />
              </button>
            </span>
          </label>

          <div id="errorBox" class="error" role="alert" aria-live="polite"></div>

          <button id="submitBtn" class="btn" type="submit">
            <span class="btn__text" data-i18n="ui.buttons.login">Entrar</span>
            <span class="btn__shine" aria-hidden="true"></span>
          </button>

          <p class="legal" data-i18n="ui.labels.login_legal">
            Você está acessando um ambiente experimental da Irricontrol.
            Esta plataforma é destinada exclusivamente a testes, simulações e validações internas.
          </p>
        </form>
      </section>

      <p id="login-version" class="login-version"></p>
    </main>
  </div>  <div id="ui-wrapper">
  <!-- =========================================
      TOPBAR
      ========================================= -->
  <div id="app-topbar" class="absolute top-0 left-0 right-0 h-14 bg-[#060B10] border-b-[2px] border-white/15 z-50 flex items-center justify-start px-4 relative">

    <!-- Botão de menu (drawer) - somente mobile -->
    <button id="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-controls="sidebar-left" aria-expanded="false">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Idiomas -->
    <div id="topbar-group-lang" class="flex items-center gap-3" aria-label="Idioma" data-i18n="ui.labels.language" data-i18n-attr="aria-label">
      <button data-lang="pt-br" class="hover:scale-110 transition" title="Português (BR)" type="button" aria-label="Português (BR)">
        <img src="assets/images/br.svg" class="w-8 h-5" alt="Português">
      </button>
      <button data-lang="es" class="hover:scale-110 transition" title="Español" type="button" aria-label="Español">
        <img src="assets/images/es.svg" class="w-8 h-5" alt="Español">
      </button>
      <button data-lang="de" class="hover:scale-110 transition" title="Deutsch" type="button" aria-label="Deutsch">
        <img src="assets/images/de.svg" class="w-8 h-5" alt="Deutsch">
      </button>
      <button data-lang="en" class="hover:scale-110 transition" title="English" type="button" aria-label="English">
        <img src="assets/images/uk.svg" class="w-8 h-5" alt="English">
      </button>
      <button data-lang="ru" class="hover:scale-110 transition" title="Русский" type="button" aria-label="Русский">
        <img src="assets/images/ru.svg" class="w-8 h-5" alt="Russian">
      </button>
    </div>

    <!-- Ferramentas -->
    <div id="topbar-group-tools" class="flex items-center gap-2 ml-24">
      <span class="text-white/70 text-sm font-medium" data-i18n="ui.labels.tools"></span>

      <button id="btn-los-pivot-a-pivot" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.los_pivots" type="button" aria-label="Linha de visada entre pivôs">
        <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/radio-tower.svg); mask-image: url(assets/images/radio-tower.svg);"></span>
      </button>

      <button id="btn-buscar-locais-repetidora" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.find_repeater_locations" type="button" aria-label="Encontrar locais para repetidora">
        <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/view.svg); mask-image: url(assets/images/view.svg);"></span>
      </button>
    </div>

    <!-- Legendas -->
    <div id="topbar-group-legends" class="flex items-center gap-2 ml-[20px]">
      <span class="text-white/70 text-sm font-medium" data-i18n="ui.labels.legends_group"></span>

      <button id="btn-visada" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.line_of_sight" type="button" aria-label="Linha de visada">
        <span class="sidebar-icon w-5 h-5 bg-white" style="-webkit-mask-image: url(assets/images/mountain.svg); mask-image: url(assets/images/mountain.svg);"></span>
      </button>

      <button id="toggle-legenda" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.legend" type="button" aria-label="Mostrar/esconder legenda">
        <span class="sidebar-icon w-5 h-5 bg-white" style="-webkit-mask-image: url(assets/images/captions.svg); mask-image: url(assets/images/captions.svg);"></span>
      </button>

      <button id="toggle-antenas-legendas" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.toggle_antenna_legends" type="button" aria-label="Alternar legendas de antenas">
        <span class="sidebar-icon w-5 h-5 bg-white" style="-webkit-mask-image: url(assets/images/radio.svg); mask-image: url(assets/images/radio.svg);"></span>
      </button>

      <button id="toggle-distancias-pivos" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.show_pivot_distances" type="button" aria-label="Mostrar distâncias de pivôs">
        <span class="sidebar-icon w-5 h-5 bg-white" style="-webkit-mask-image: url(assets/images/ruler-dimension-line.svg); mask-image: url(assets/images/ruler-dimension-line.svg);"></span>
      </button>
    </div>

    <!-- Desenho + Editor: no mobile este wrapper vira uma barra fixa
         embaixo da tela (ver #mobile-bottom-toolbar em mobile.css).
         No desktop é `display:contents` e não altera nada aqui. -->
    <div id="mobile-bottom-toolbar">
      <!-- Abre/fecha o menu de ferramentas (Desenho + Editor) -
           só existe no mobile, ver mobile.css/mobile.js. -->
      <button id="mobile-tools-toggle" type="button" aria-label="Ferramentas de edição" title="Ferramentas de edição" aria-expanded="false" aria-controls="mobile-tools-flyout">
        <i data-lucide="pencil" class="w-5 h-5"></i>
      </button>

      <!-- Menu de ferramentas (Desenho + Editor): no mobile fica
           oculto até tocar em #mobile-tools-toggle, e então vira um
           cartão flutuante acima da barra (ver mobile.css). No
           desktop é `display:contents`, igual ao wrapper de fora, e
           não muda nada aqui. -->
      <div id="mobile-tools-flyout">
        <!-- Desenho/Edição -->
        <div id="topbar-group-draw" class="flex items-center gap-2 ml-[20px]">
          <span class="text-white/70 text-sm font-medium" data-i18n="ui.labels.draw_group"></span>

          <button id="btn-draw-pivot" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.draw_pivot" type="button" aria-label="Desenhar pivô circular">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/circle.svg); mask-image: url(assets/images/circle.svg);"></span>
          </button>

          <button id="btn-draw-pivot-setorial" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.draw_sector_pivot" type="button" aria-label="Desenhar pivô setorial">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/half-circle.svg); mask-image: url(assets/images/half-circle.svg);"></span>
          </button>

          <button id="btn-draw-pivot-pacman" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.draw_pacman_pivot" type="button" aria-label="Desenhar pivô Pac-Man">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/circle-dashed.svg); mask-image: url(assets/images/circle-dashed.svg);"></span>
          </button>

          <button id="btn-draw-irripump" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.draw_irripump" type="button" aria-label="Adicionar casa de bombas">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/irripump.svg); mask-image: url(assets/images/irripump.svg);"></span>
          </button>
        </div>

        <!-- Editor -->
        <div id="topbar-group-editor" class="flex items-center gap-2 ml-[20px]">
          <span class="text-white/70 text-sm font-medium" data-i18n="ui.labels.editor_group"></span>

          <button id="btn-mover-pivo-sem-circulo" class="glass-button p-2 hidden" data-i18n-attr="title,aria-label" data-i18n="ui.titles.move_pivot_center" type="button" aria-label="Mover pivô sem círculo">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/pin.svg); mask-image: url(assets/images/pin.svg);"></span>
          </button>

          <!-- Modo de excluir pivô: quando ativo, o pino vermelho do
               centro de cada pivô vira um X e um toque nele já exclui
               (com confirmação) — mais direto que toque longo. -->
          <button id="btn-toggle-delete-pivo" class="glass-button p-2" type="button" aria-label="Alternar modo de excluir pivô" title="Alternar modo de excluir pivô">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>

          <button id="editar-pivos" class="glass-button p-2" data-i18n-attr="title,aria-label" data-i18n="ui.titles.edit_pivots" type="button" aria-label="Editar pivôs">
            <i data-lucide="pencil" class="w-5 h-5"></i>
          </button>

          <button id="desfazer-edicao" class="glass-button p-2 hidden" data-i18n-attr="title,aria-label" data-i18n="ui.titles.undo_edit" type="button" aria-label="Desfazer edição">
            <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/undo-2.svg); mask-image: url(assets/images/undo-2.svg);"></span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Logout -->
    <div id="topbar-group-logout" class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center">
      <button id="btn-logout" class="glass-button p-2" type="button" title="Sair" aria-label="Sair" data-i18n="ui.buttons.logout" data-i18n-attr="title,aria-label">
        <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/log-out.svg); mask-image: url(assets/images/log-out.svg);"></span>
        <!-- Texto só aparece quando o mobile.js move este botão pra
             dentro do drawer da sidebar (ver mobile.css/mobile.js) -->
        <span class="btn-logout-label text-sm font-medium" data-i18n="ui.buttons.logout">Sair</span>
      </button>
    </div>
  </div>

  <!-- Fundo do drawer mobile (fecha ao tocar fora) -->
  <div id="mobile-drawer-backdrop"></div>

  <!-- =========================================
      SIDEBAR ESQUERDA
      ========================================= -->
  <div id="sidebar-left" class="absolute top-14 bottom-14 left-0 w-[280px] bg-[#060B10] z-50 p-4 overflow-y-auto">
    <!-- Fecha o drawer - somente mobile -->
    <button id="sidebar-mobile-close" type="button" aria-label="Fechar menu">✖</button>

    <!-- Template/modelo -->
    <div class="mb-4 backdrop-blur bg-white/5 border border-white/15 px-3 py-[6px] rounded-lg shadow-sm flex items-center gap-2">
      <label for="template-modelo" class="text-sm text-white/70 whitespace-nowrap" data-i18n="ui.labels.template"></label>
      <select id="template-modelo" class="px-2 py-[3px] rounded-md bg-[#060B10]/70 border border-white/15 text-white/80 text-sm focus:outline-none focus:ring-1 focus:ring-green-500 transition w-full" aria-label="Template"></select>
    </div>

    <!-- Busca por coordenadas -->
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2 backdrop-blur bg-white/5 border border-white/15 px-2 rounded-lg shadow-sm focus-within:ring-1 focus-within:ring-green-500 transition h-10">
        <button id="coord-search-btn" class="flex items-center justify-center p-1 text-white/70 hover:text-green-500 transition ml-1" data-i18n-attr="title,aria-label" data-i18n="ui.titles.search_coordinates" type="button" aria-label="Ir para coordenadas">
          <span class="sidebar-icon w-5 h-5" style="-webkit-mask-image: url(assets/images/map-pin.svg); mask-image: url(assets/images/map-pin.svg);"></span>
        </button>
        <input type="text" id="lat-long-input-field" data-i18n-attr="placeholder" data-i18n="ui.placeholders.lat_lon_search" class="flex-grow h-full pl-0 pr-2 rounded-md bg-transparent border-none text-sm text-white/80 placeholder:text-white/50 focus:outline-none focus:ring-0" autocomplete="off" aria-label="Pesquisar por latitude e longitude" />
      </div>

      <!-- Upload KMZ -->
      <div class="flex flex-col gap-3">
        <label for="arquivo" class="sidebar-button w-full h-10 cursor-pointer flex items-center gap-2 border border-white/15 rounded-lg backdrop-blur bg-white/5 text-white/70 shadow-sm px-2" aria-label="Selecionar arquivo KMZ" title="Importar arquivo KMZ do estudo" data-i18n-attr="title,aria-label" data-i18n="tooltips.load_kmz">
          <span class="sidebar-icon w-5 h-5 ml-2" style="-webkit-mask-image: url(assets/images/file-up.svg); mask-image: url(assets/images/file-up.svg);"></span>
          <span id="nome-arquivo-label" class="text-sm font-medium truncate" data-i18n="ui.labels.choose_kmz"></span>
        </label>
        <input type="file" id="arquivo" accept=".kmz" required class="hidden" />
      </div>

      <!-- Ações gerais -->
      <button id="simular-btn"
        class="sidebar-button w-full h-10 items-center gap-2 border border-white/15 rounded-lg backdrop-blur bg-white/5 text-white/70 shadow-sm hidden px-2"
        type="button" aria-label="Executar estudo" data-i18n-attr="title,aria-label" data-i18n="tooltips.run_signal_simulation">
        <span class="sidebar-icon w-5 h-5 ml-2" style="-webkit-mask-image: url(assets/images/radio.svg); mask-image: url(assets/images/radio.svg);"></span>
        <span class="text-sm font-medium" data-i18n="ui.buttons.run_study"></span>
      </button>

      <button id="exportar-btn"
              class="sidebar-button w-full h-10 flex items-center gap-2 border border-white/15 rounded-lg backdrop-blur bg-white/5 text-white/70 shadow-sm px-2 disabled:opacity-50 disabled:cursor-not-allowed"
              type="button"
              disabled
              aria-label="Baixar Arquivo KMZ"
              data-i18n-attr="title,aria-label"
              data-i18n="tooltips.export_kmz_disabled">
          <span class="sidebar-icon w-5 h-5 ml-2" style="-webkit-mask-image: url(assets/images/download.svg); mask-image: url(assets/images/download.svg);"></span>
          <span class="text-sm font-medium" data-i18n="ui.buttons.export_kmz"></span>
      </button>

      <button id="resetar-btn" class="sidebar-button w-full h-10 flex items-center gap-2 border border-white/15 rounded-lg backdrop-blur bg-white/5 text-white/70 shadow-sm px-2" type="button" aria-label="Resetar" title="Reiniciar a sessão e limpar o mapa" data-i18n="ui.buttons.reset" data-i18n-attr="aria-label">
        <span class="sidebar-icon w-5 h-5 ml-2" style="-webkit-mask-image: url(assets/images/undo-2.svg); mask-image: url(assets/images/undo-2.svg);"></span>
        <span class="text-sm font-medium" data-i18n="ui.buttons.reset"></span>
      </button>
    </div>

    <!-- Painel (setup) de repetidora -->
    <div id="painel-repetidora" class="mt-4 bg-white/5 border border-white/15 backdrop-blur-md rounded-xl shadow-lg w-60 p-2 hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-semibold text-sm text-white/80"><span class="titulo-icone">📡</span><span data-i18n="ui.titles.repeater_panel_setup"></span></h2>
        <button id="fechar-painel-rep" class="close-btn" type="button" aria-label="Fechar" data-i18n="ui.titles.close" data-i18n-attr="aria-label">✖</button>
      </div>

      <label for="altura-antena-rep" class="text-xs text-white/60 mb-1 block" data-i18n="ui.labels.antenna_height"></label>
      <input id="altura-antena-rep" type="number" value="5" class="w-full h-8 px-2 rounded-lg border border-white/20 bg-[#060B10]/40 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-500 transition mb-3" />

      <label for="altura-receiver-rep" class="text-xs text-white/60 mb-1 block" data-i18n="ui.labels.receiver_height"></label>
      <input id="altura-receiver-rep" type="number" value="3" class="w-full h-8 px-2 rounded-lg border border-white/20 bg-[#060B10]/40 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-500 transition mb-3" />

      <button id="confirmar-repetidora"

        <span class="text-xs font-medium" data-i18n="ui.buttons.download_active_pngs"></span>

      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-white/80" data-i18n="ui.titles.data_panel"></h2>
        <button class="panel-toggle-btn text-white/60 hover:text-green-500" type="button" aria-label="Recolher/expandir painel" data-i18n="ui.titles.toggle_panel" data-i18n-attr="aria-label">
          <i data-lucide="chevron-up" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="panel-content">
        <div class="flex justify-between items-center mb-3">
          <span id="template-info" class="font-medium text-sm text-green-500"></span>
        </div>

        <p id="total-pivos" class="text-sm text-white/70 mb-1" data-i18n="ui.labels.total_pivots"></p>
        <p id="fora-cobertura" class="text-sm text-white/70 mb-1" data-i18n="ui.labels.out_of_coverage"></p>

            <span data-i18n="ui.buttons.export_pdf_report">Exportar Relatório Completo</span>
          </button>
        </div>
      </div>
    </div>

<div id="loader"

</div>

       ao redor (sidebar, topbar, painéis, barra do mobile) e deixa só
       o mapa com os desenhos em tela cheia de verdade quando o
       navegador suporta -- pensado pra tirar um print limpo do
       estudo pronto. Elemento próprio, separado do #legend-container

  <button id="btn-screenshot-mode" type="button" class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-full bg-black/70 border border-white/20 text-white shadow-md hover:bg-black/90 transition" data-i18n-attr="title,aria-label" data-i18n="ui.titles.screenshot_mode" aria-label="Tela cheia para captura" title="Tela cheia para captura" aria-pressed="false">

    <div id="custom-confirm-box"

      <div class="px-6">

        <button id="custom-confirm-ok-btn" class="confirm-btn-ok px-5 py-2 rounded-md bg-green-600 text-white font-semibold transition hover:bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.4)]" data-i18n="ui.buttons.confirm" type="button">
          Confirmar
        </button>
      </div>
    </div>
  </div>

      <div class="flex items-center justify-between bg-black/20 px-6 py-3 rounded-t-xl border-b border-white/10">

            <div class="los-legend-vertical" data-i18n="ui.chart_labels.receiver_elevation_m">

            <div id="receiver-height-value-vertical" class="los-vertical-value">3 m</div>
          </div>
        </div>
      </div>
